name: Check Spelling

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  spelling:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Spell Check
        uses: UnicornGlobal/spellcheck-github-actions@master
